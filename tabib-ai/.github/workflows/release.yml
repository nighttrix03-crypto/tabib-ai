name: Build Windows installer
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build app and single-file installer
        shell: pwsh
        run: ./build-installer.ps1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME installer/dist/TabibAI-Setup.exe --title "طبيب AI $env:GITHUB_REF_NAME" --generate-notes
